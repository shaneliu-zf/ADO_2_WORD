<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADO → Word</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="workspace">
  <aside class="pane-left">
    <header class="pane-head">
      <div>
        <h1>ADO</h1>
        <p class="sub" id="ado-count">0 筆</p>
      </div>
      <button type="button" class="btn-text" id="select-all">全選</button>
    </header>
    <div id="ado-list" class="ado-list">
      <p class="empty">還沒有 Work Item。按右邊「下一步」先列出 ID，或先 fetch 過的會自動出現。</p>
    </div>
  </aside>
  <main class="pane-right">
    <div class="progress-wrap">
      <div class="progress" id="progress" aria-hidden="true">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>
    <ol id="steps" class="steps"></ol>
    <p id="status" class="status empty">從第一步開始，每次只處理目前勾選的 ADO。</p>
    <div class="pane-foot">
      <button type="button" class="btn-prev" id="prev">上一步</button>
      <button type="button" class="btn-next" id="next">下一步</button>
    </div>
  </main>
  <div id="overlay" class="overlay" hidden>
    <div class="overlay-card">
      <div class="overlay-toolbar">
        <div class="overlay-tabs" id="overlay-tabs">
          <button type="button" class="overlay-tab" data-tab="ado" id="tab-ado">ADO 原文</button>
          <button type="button" class="overlay-tab" data-tab="bob" id="tab-bob" disabled>Bob 報告</button>
        </div>
        <button type="button" class="btn-text overlay-close" id="overlay-close">關閉</button>
      </div>
      <div id="overlay-body"></div>
    </div>
  </div>
  <script>
    const PIPELINE = [
      { key: "list_ids", label: "列出 ID", hint: "列出專案全部 Work Item（標題、類型、狀態）" },
      { key: "fetch", label: "抓取 ADO", hint: "下載 JSON、圖片與變動歷史" },
      { key: "group", label: "關聯分組", hint: "Related Work Item 合併成一組" },
      { key: "report_by_llm", label: "Bob 報告", hint: "整理成測試報告 JSON（會扣 Bobcoins）" },
      { key: "word", label: "產出 Word", hint: "填進範本，寫出 report_*.docx" },
    ];
    const CUSTOM_KEYS = [
      "Custom.Case", "Custom.Step", "Custom.Program", "Custom.Category",
      "Custom.Systems", "Custom.Tag", "Custom.IssuePriority",
      "Custom.PrimaryCause", "Custom.Solution",
    ];
    const META_KEYS = [
      "System.Id", "System.WorkItemType", "System.Title", "System.State",
      "System.AssignedTo", "System.CreatedBy", "System.CreatedDate",
      "System.ChangedBy", "System.ChangedDate", "System.AreaPath",
      "System.IterationPath", "System.Tags",
    ];
    const REPORT_META = [
      ["ADO主旨", "ado_subject"],
      ["測試環境", "test_environment"],
      ["Site", "site"],
      ["版本號", "version"],
      ["測試日期", "test_date"],
      ["測試人員", "tester"],
      ["審核人員", "reviewer"],
    ];
    const HTML_KEYS = new Set([
      "System.Description",
      "Microsoft.VSTS.TCM.ReproSteps",
      "Microsoft.VSTS.TCM.Steps",
    ]);

    const state = {
      items: [],
      selected: new Set(),
      groups: [],
      reportIds: new Set(),
      stepIndex: 0,
      busy: false,
    };
    const overlayState = { id: null, ado: null, report: null, tab: "ado" };

    const adoList = document.getElementById("ado-list");
    const adoCount = document.getElementById("ado-count");
    const stepsEl = document.getElementById("steps");
    const statusEl = document.getElementById("status");
    const nextBtn = document.getElementById("next");
    const prevBtn = document.getElementById("prev");
    const overlay = document.getElementById("overlay");
    const overlayBody = document.getElementById("overlay-body");
    const tabAdo = document.getElementById("tab-ado");
    const tabBob = document.getElementById("tab-bob");

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function stringify(value) {
      if (value == null || value === "") return "";
      if (Array.isArray(value)) {
        return value.map(stringify).filter(Boolean).join("; ");
      }
      if (typeof value === "object") {
        return value.displayName || value.uniqueName || JSON.stringify(value);
      }
      if (typeof value === "boolean") return value ? "TRUE" : "FALSE";
      return String(value);
    }

    function fieldLabel(key) {
      return key.startsWith("Custom.") ? key.slice("Custom.".length) : key;
    }

    function historyLabel(key) {
      if (key === "relation") return "關聯";
      if (key === "System.AssignedTo") return "指派";
      if (key === "System.State") return "狀態";
      if (key === "System.Reason") return "原因";
      return fieldLabel(key);
    }

    function rewriteImages(text, images) {
      if (!text) return "";
      let out = text;
      Object.entries(images || {}).forEach(([url, local]) => {
        if (url) out = out.split(url).join(local);
      });
      return out;
    }

    function looksLikeHtml(text) {
      return /<\/?(div|p|table|img|span|br|h[1-6]|ul|ol|li|pre|code|blockquote)\b/i.test(text);
    }

    function renderBody(text, images) {
      const localized = rewriteImages(stringify(text), images);
      if (!localized.trim()) return '<span class="empty">（空）</span>';
      if (looksLikeHtml(localized)) {
        return `<div class="html-body">${localized}</div>`;
      }
      return `<div class="html-body">${escapeHtml(localized).replace(/\n/g, "<br>\n")}</div>`;
    }

    function renderRows(keys, fields, images, always) {
      return keys
        .filter((key) => always || Object.prototype.hasOwnProperty.call(fields, key))
        .map((key) => {
          const raw = fields[key];
          const cell = stringify(raw)
            ? renderBody(raw, images)
            : '<span class="empty">（空）</span>';
          return `<tr><th>${escapeHtml(fieldLabel(key))}</th><td>${cell}</td></tr>`;
        })
        .join("");
    }

    function selectedIds() {
      return state.items.map((item) => item.id).filter((id) => state.selected.has(id));
    }

    function groupIndexOf(id) {
      return state.groups.findIndex((group) => group.includes(id));
    }

    function setStatus(message, kind) {
      statusEl.className = "status" + (kind ? " " + kind : "");
      statusEl.textContent = message;
    }

    function renderList() {
      const count = state.items.length;
      const picked = selectedIds().length;
      adoCount.textContent = count ? `${count} 筆　已選 ${picked}` : "0 筆";
      if (!count) {
        adoList.innerHTML = '<p class="empty">還沒有 Work Item。按右邊「下一步」先列出 ID。</p>';
        return;
      }
      adoList.innerHTML = state.items
        .map((item) => {
          const checked = state.selected.has(item.id) ? "checked" : "";
          const groupNo = groupIndexOf(item.id);
          const badge = groupNo >= 0 ? `<span class="badge">組 ${groupNo + 1}</span>` : "";
          const bob = state.reportIds.has(item.id) ? '<span class="badge bob">Bob</span>' : "";
          const typeState = [item.work_item_type, item.state].filter(Boolean).join(" · ");
          return `<label class="ado-row">
            <input type="checkbox" data-id="${item.id}" ${checked}>
            <span class="ado-meta">
              <span class="ado-id">#${item.id}${typeState ? " · " + escapeHtml(typeState) : ""} ${badge}${bob}</span>
              <button type="button" class="ado-title" data-open="${item.id}">${escapeHtml(item.title || "（無標題）")}</button>
            </span>
          </label>`;
        })
        .join("");
    }

    function renderSteps() {
      stepsEl.innerHTML = PIPELINE.map((step, index) => {
        let kind = "pending";
        if (index < state.stepIndex) kind = "done";
        else if (index === state.stepIndex) kind = "current";
        const mark = kind === "done" ? "✓" : String(index + 1);
        const running = kind === "current" && state.busy;
        const bar = running
          ? '<span class="step-progress"><span></span></span>'
          : "";
        return `<li class="step ${kind}${running ? " busy" : ""}">
          <span class="step-mark">${mark}</span>
          <span class="step-body">
            <strong>${escapeHtml(step.label)}</strong>
            <span class="step-hint">${escapeHtml(step.hint)}</span>
            ${bar}
          </span>
        </li>`;
      }).join("");

      const bar = document.getElementById("progress-bar");
      const wrap = document.getElementById("progress");
      const total = PIPELINE.length;
      if (state.busy) {
        wrap.classList.add("busy");
        bar.style.width = "";
      } else {
        wrap.classList.remove("busy");
        bar.style.width = `${Math.min(state.stepIndex, total) / total * 100}%`;
      }

      if (state.busy) {
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        nextBtn.textContent = "處理中…";
        return;
      }
      prevBtn.disabled = state.stepIndex <= 0;
      if (state.stepIndex >= PIPELINE.length) {
        nextBtn.disabled = true;
        nextBtn.textContent = "已完成";
        return;
      }
      nextBtn.disabled = false;
      nextBtn.textContent = `下一步：${PIPELINE[state.stepIndex].label}`;
    }

    function render() {
      renderList();
      renderSteps();
    }

    function replaceItems(ids, extras) {
      const byId = new Map(state.items.map((item) => [item.id, item]));
      state.items = ids.map((id) => {
        const extra = (extras || []).find((item) => Number(item.id) === Number(id)) || {};
        const prev = byId.get(id) || {};
        return {
          id: Number(id),
          title: extra.title || prev.title || "",
          state: extra.state || prev.state || "",
          work_item_type: extra.work_item_type || prev.work_item_type || "",
        };
      });
      state.selected = new Set(state.items.map((item) => item.id));
    }

    async function loadExistingIndex() {
      const resp = await fetch("index.json");
      if (!resp.ok) return;
      const payload = await resp.json();
      const items = payload.items || [];
      if (!items.length) return;
      state.items = items.map((item) => ({
        id: Number(item.id),
        title: item.title || "",
        state: item.state || "",
        work_item_type: item.work_item_type || "",
      }));
      state.selected = new Set(state.items.map((item) => item.id));
      state.stepIndex = Math.max(state.stepIndex, 2);
      setStatus(`已載入 ${state.items.length} 筆先前抓取的 ADO。下一步是「${PIPELINE[state.stepIndex].label}」。`);
    }

    async function loadReports() {
      const resp = await fetch("/api/reports");
      if (!resp.ok) return;
      const payload = await resp.json();
      state.reportIds = new Set((payload.ids || []).map(Number));
    }

    function payloadFor(stepKey) {
      if (stepKey === "list_ids") return null;
      const ids = selectedIds();
      if (!ids.length) throw new Error("請先在左邊勾選要處理的 ADO。");
      if (stepKey === "report_by_llm" && state.groups.length) {
        const picked = new Set(ids);
        const groups = state.groups
          .map((group) => group.filter((id) => picked.has(id)))
          .filter((group) => group.length);
        return groups.length ? groups : ids;
      }
      return ids;
    }

    async function runNext() {
      if (state.busy || state.stepIndex >= PIPELINE.length) return;
      const step = PIPELINE[state.stepIndex];
      let body;
      try {
        body = payloadFor(step.key);
      } catch (err) {
        setStatus(err.message, "error");
        return;
      }
      state.busy = true;
      setStatus(`正在執行「${step.label}」…`);
      render();
      try {
        const resp = await fetch("/api/" + step.key, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: body == null ? "" : JSON.stringify(body),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || resp.statusText);
        const summary = await applyResult(step.key, data);
        state.stepIndex += 1;
        const done = state.stepIndex >= PIPELINE.length;
        if (summary) setStatus(summary);
        else {
          setStatus(
            done
              ? "五步都跑完了。"
              : `「${step.label}」完成。下一步：${PIPELINE[state.stepIndex].label}`
          );
        }
      } catch (err) {
        setStatus(String(err.message || err), "error");
      } finally {
        state.busy = false;
        render();
      }
    }

    async function applyResult(key, data) {
      if (key === "list_ids") {
        const rows = data || [];
        const ids = rows.map((item) => Number(item && item.id != null ? item.id : item));
        replaceItems(ids, rows);
        return `列出 ${state.items.length} 筆。請勾選要抓取的，再按下一步。`;
      }
      if (key === "fetch") {
        const resp = await fetch("index.json");
        const extras = resp.ok ? ((await resp.json()).items || []) : [];
        replaceItems(data || selectedIds(), extras);
        return `已抓取 ${state.items.length} 筆。`;
      }
      if (key === "group") {
        state.groups = data || [];
        const ids = state.groups.flat();
        if (ids.length) replaceItems(ids, state.items);
        return `分成 ${state.groups.length} 組。`;
      }
      if (key === "report_by_llm") {
        await loadReports();
        const count = state.reportIds.size;
        return `已產出 ${count} 筆 Bob 報告。點左邊標題可切換「Bob 報告」。`;
      }
      if (key === "word") {
        const paths = Array.isArray(data) ? data.join("、") : String(data);
        return `已產出 Word：${paths}`;
      }
      return "";
    }

    function updateOverlayTabs() {
      tabAdo.classList.toggle("active", overlayState.tab === "ado");
      tabBob.classList.toggle("active", overlayState.tab === "bob");
      tabBob.disabled = !overlayState.report;
    }

    function renderAdo(item, id) {
      const fields = item.fields || {};
      const images = item.images || {};
      const used = new Set([...CUSTOM_KEYS, ...META_KEYS, ...HTML_KEYS]);
      const extraKeys = Object.keys(fields).filter((key) => !used.has(key)).sort();
      const title = stringify(item.title || fields["System.Title"] || `Work Item ${id}`);
      const history = (item.history || [])
        .map((entry) => {
          const when = escapeHtml(stringify(entry.date).replace("T", " ").replace(/Z$/, ""));
          const by = escapeHtml(stringify(entry.by) || "未知");
          const lines = (entry.changes || [])
            .map((change) => {
              const label = historyLabel(change.field || "");
              const from = stringify(change.from);
              const to = stringify(change.to);
              const arrow = from && to ? `${escapeHtml(from)} → ${escapeHtml(to)}`
                : from ? `移除 ${escapeHtml(from)}`
                : escapeHtml(to);
              return `<div>${escapeHtml(label)}：${arrow}</div>`;
            })
            .join("");
          return `<tr><td>${when}</td><td>${by}</td><td>${lines || '<span class="empty">（無）</span>'}</td></tr>`;
        })
        .join("");
      const comments = (item.comments || [])
        .map((comment) => {
          const author = escapeHtml(stringify(comment.created_by) || "未知");
          const created = escapeHtml(stringify(comment.created_date));
          return `<article class="comment"><header>${author} · ${created}</header>${renderBody(comment.text, images)}</article>`;
        })
        .join("");
      const relations = (item.relations || [])
        .map((rel) => {
          const name = escapeHtml(stringify((rel.attributes || {}).name || rel.rel));
          const url = stringify(rel.url);
          return `<li>${name}：<a href="${escapeHtml(url)}">${escapeHtml(url)}</a></li>`;
        })
        .join("");
      return `
        <h1>#${escapeHtml(String(id))} ${escapeHtml(title)}</h1>
        <p class="sub">${escapeHtml(stringify(item.work_item_type))} · ${escapeHtml(stringify(item.state))} · 抓取時間 ${escapeHtml(stringify(item.fetched_at))}</p>
        <h2>自訂欄位</h2>
        <table class="meta">${renderRows(CUSTOM_KEYS, fields, images, true)}</table>
        <h2>系統欄位</h2>
        <table class="meta">${renderRows(META_KEYS, fields, images, false)}${renderRows(extraKeys, fields, images, false)}</table>
        <h2>變動歷史</h2>
        ${history ? `<table class="index history"><tr><th>時間</th><th>操作者</th><th>變更</th></tr>${history}</table>` : '<p class="empty">沒有變動紀錄</p>'}
        <h2>描述</h2>
        ${renderBody(fields["System.Description"], images)}
        <h2>留言</h2>
        ${comments || '<p class="empty">沒有留言</p>'}
        <h2>關聯</h2>
        ${relations ? `<ul>${relations}</ul>` : '<p class="empty">沒有關聯</p>'}
      `;
    }

    function renderReport(report) {
      const adoIds = (report.ado_ids || [report.ado_id]).filter(Boolean);
      const adoText = adoIds.map((value) => `ADO#${value}`).join("、");
      const redmine = String(report.redmine_id || "").trim();
      const heading = redmine ? `${adoText} / Redmine#${redmine}` : adoText;
      const metaRows = REPORT_META.map(([label, key]) => {
        const value = stringify(report[key]);
        const cell = value
          ? `<div class="html-body">${escapeHtml(value).replace(/\n/g, "<br>\n")}</div>`
          : '<span class="empty">（空）</span>';
        return `<tr><th>${escapeHtml(label)}</th><td>${cell}</td></tr>`;
      }).join("");
      const items = (report.test_items || []).map((item) => {
        const data = (item.test_data || [])
          .map((line) => `<div>${escapeHtml(stringify(line))}</div>`)
          .join("") || '<span class="empty">（空）</span>';
        return `<tr>
          <td>${escapeHtml(stringify(item.no))}</td>
          <td>${escapeHtml(stringify(item.item_name))}</td>
          <td>${data}</td>
          <td>${escapeHtml(stringify(item.expected_result))}</td>
          <td>${escapeHtml(stringify(item.test_result))}</td>
        </tr>`;
      }).join("");
      const steps = (report.test_steps || []).map((step) => {
        const images = (step.images || [])
          .filter(Boolean)
          .map((src) => `<img src="${escapeHtml(src)}" alt="">`)
          .join("");
        return `<article class="report-step">
          <header>步驟 ${escapeHtml(stringify(step.no))}</header>
          <div>${escapeHtml(stringify(step.description)).replace(/\n/g, "<br>\n")}</div>
          ${images ? `<div class="step-images">${images}</div>` : ""}
        </article>`;
      }).join("");
      const historyRows = (report.change_history || []).map((entry) => {
        const date = escapeHtml(stringify(entry.date).replace("T", " ").replace(/Z$/, ""));
        return `<tr>
          <td style="white-space:nowrap">${date}</td>
          <td>${escapeHtml(stringify(entry.by))}</td>
          <td>${escapeHtml(stringify(entry.field))}</td>
          <td>${escapeHtml(stringify(entry.old))}</td>
          <td>${escapeHtml(stringify(entry.new))}</td>
        </tr>`;
      }).join("");
      return `
        <h1>${escapeHtml(heading)}</h1>
        <p class="sub">Bob 整理後的測試報告</p>
        <h2>主旨資料</h2>
        <table class="meta">${metaRows}</table>
        <h2>測試項目</h2>
        ${items
          ? `<table class="index"><tr><th>No</th><th>測試項目</th><th>測試資料</th><th>預期結果</th><th>測試結果</th></tr>${items}</table>`
          : '<p class="empty">沒有測試項目</p>'}
        <h2>測試步驟</h2>
        ${steps || '<p class="empty">沒有測試步驟</p>'}
        <h2>變動紀錄</h2>
        ${historyRows
          ? `<table class="index history"><tr><th>時間</th><th>操作者</th><th>欄位</th><th>原值</th><th>新值</th></tr>${historyRows}</table>`
          : '<p class="empty">沒有變動紀錄</p>'}
      `;
    }

    function renderOverlay() {
      updateOverlayTabs();
      if (overlayState.tab === "bob") {
        if (!overlayState.report) {
          overlayBody.innerHTML = '<p class="empty">尚未有 Bob 報告，請先跑「Bob 報告」。</p>';
          return;
        }
        overlayBody.innerHTML = renderReport(overlayState.report);
        return;
      }
      if (!overlayState.ado) {
        overlayBody.innerHTML = `<p class="error">找不到 work_item_${overlayState.id}.json，請先跑完「抓取 ADO」。</p>`;
        return;
      }
      overlayBody.innerHTML = renderAdo(overlayState.ado, overlayState.id);
    }

    async function showItem(id) {
      overlayState.id = Number(id);
      overlayState.ado = null;
      overlayState.report = null;
      overlayState.tab = "ado";
      overlayBody.innerHTML = '<p class="empty">載入中…</p>';
      overlay.hidden = false;
      updateOverlayTabs();
      const [adoResp, reportResp] = await Promise.all([
        fetch(`work_item_${id}.json`),
        fetch(`/api/report/${id}`),
      ]);
      if (adoResp.ok) overlayState.ado = await adoResp.json();
      if (reportResp.ok) overlayState.report = await reportResp.json();
      overlayState.tab = overlayState.report ? "bob" : "ado";
      renderOverlay();
    }

    adoList.addEventListener("change", (event) => {
      const id = Number(event.target.dataset.id);
      if (!id) return;
      if (event.target.checked) state.selected.add(id);
      else state.selected.delete(id);
      renderList();
    });

    adoList.addEventListener("click", (event) => {
      const open = event.target.closest("[data-open]");
      if (!open) return;
      event.preventDefault();
      showItem(open.dataset.open);
    });

    document.getElementById("select-all").addEventListener("click", () => {
      const ids = state.items.map((item) => item.id);
      const allOn = ids.length && ids.every((id) => state.selected.has(id));
      state.selected = allOn ? new Set() : new Set(ids);
      renderList();
    });

    document.getElementById("overlay-tabs").addEventListener("click", (event) => {
      const tab = event.target.closest("[data-tab]");
      if (!tab || tab.disabled) return;
      overlayState.tab = tab.dataset.tab;
      renderOverlay();
    });

    document.getElementById("overlay-close").addEventListener("click", () => {
      overlay.hidden = true;
    });
    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) overlay.hidden = true;
    });
    nextBtn.addEventListener("click", runNext);
    prevBtn.addEventListener("click", () => {
      if (state.busy || state.stepIndex <= 0) return;
      state.stepIndex -= 1;
      const step = PIPELINE[state.stepIndex];
      setStatus(`回到「${step.label}」。再按下一步會重跑這一步。`);
      render();
    });

    Promise.all([loadExistingIndex(), loadReports()])
      .then(() => {
        if (state.reportIds.size) state.stepIndex = Math.max(state.stepIndex, 4);
      })
      .catch(() => {})
      .finally(render);
  </script>
</body>
</html>
